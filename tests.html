<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Validator tests</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 48rem;
        margin: 0 auto;
        padding: 1rem;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.5rem;
      }
      h2 {
        font-size: 1.1rem;
        margin-top: 1.5rem;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        padding: 0.25rem 0.5rem;
        margin-bottom: 2px;
        border-left: 4px solid;
      }
      li.pass {
        color: #14532d;
        background: #ecfdf3;
        border-color: #15803d;
      }
      li.fail {
        color: #7f1d1d;
        background: #fef2f2;
        border-color: #b00020;
        font-weight: 700;
      }
      #summary {
        font-size: 1.15rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>Tests</h1>
    <p id="summary" role="status">Running tests...</p>
    <div id="output"></div>

    <script type="module">
      import {
        patterns,
        normalizeDescription,
        isRealDate,
        validateDescription,
        validateAmount,
        validateDate,
        validateCategory,
        checkDuplicateWords,
        validateRecord,
        validateCurrencyCode,
        validateRate,
        validateCategoriesText,
        validateStoredRecord,
        validateSettingsObject,
        validateImportData,
      } from "./scripts/validators.js";
      import {
        totalAmount,
        topCategory,
        trendLastSevenDays,
        capStatus,
        capMessage,
        convert,
        displayNumber,
        formatMoney,
        getRate,
      } from "./scripts/state.js";
      import { compileRegex, recordMatches } from "./scripts/search.js";

      /* Tiny test helpers */
      let passed = 0;
      let failed = 0;
      let currentList = null;

      function group(title) {
        const h2 = document.createElement("h2");
        h2.textContent = title;
        currentList = document.createElement("ul");
        document.querySelector("#output").append(h2, currentList);
      }

      function assert(name, condition) {
        const li = document.createElement("li");
        li.className = condition ? "pass" : "fail";
        li.textContent = `${condition ? "PASS" : "FAIL"}: ${name}`;
        currentList.append(li);
        condition ? passed++ : failed++;
      }

      /*  Description  */
      group("Description (no leading or trailing spaces)");
      assert(
        '"Lunch at cafeteria" is valid',
        validateDescription("Lunch at cafeteria").valid,
      );
      assert('"A" (one character) is valid', validateDescription("A").valid);
      assert(
        '" Lunch" (leading space) is invalid',
        !validateDescription(" Lunch").valid,
      );
      assert(
        '"Lunch " (trailing space) is invalid',
        !validateDescription("Lunch ").valid,
      );
      assert('"" (empty) is invalid', !validateDescription("").valid);
      assert(
        "Double spaces collapse to one",
        normalizeDescription("Bus   pass") === "Bus pass",
      );
      assert(
        '"Bus  pass" (double space inside) is valid after collapsing',
        validateDescription("Bus  pass").valid,
      );

      /*  Amount  */
      group("Amount");
      assert('"12.50" is valid', validateAmount("12.50").valid);
      assert('"0" is valid', validateAmount("0").valid);
      assert('"89.99" is valid', validateAmount("89.99").valid);
      assert('"1000000" (large) is valid', validateAmount("1000000").valid);
      assert('"0.05" (small) is valid', validateAmount("0.05").valid);
      assert('"012" (leading zero) is invalid', !validateAmount("012").valid);
      assert(
        '"12.345" (3 decimals) is invalid',
        !validateAmount("12.345").valid,
      );
      assert('"-5" (negative) is invalid', !validateAmount("-5").valid);
      assert('"abc" is invalid', !validateAmount("abc").valid);
      assert('"" (empty) is invalid', !validateAmount("").valid);

      /*  Date  */
      group("Date (YYYY-MM-DD)");
      assert('"2025-09-29" is valid', validateDate("2025-09-29").valid);
      assert(
        '"2024-02-29" (leap day) is valid',
        validateDate("2024-02-29").valid,
      );
      assert(
        '"2025-13-01" (month 13) is invalid',
        !validateDate("2025-13-01").valid,
      );
      assert(
        '"2025-9-5" (no zero padding) is invalid',
        !validateDate("2025-9-5").valid,
      );
      assert(
        '"29/09/2025" (wrong format) is invalid',
        !validateDate("29/09/2025").valid,
      );
      assert(
        '"2025-02-30" (matches regex, not a real date) is invalid',
        !validateDate("2025-02-30").valid,
      );
      assert(
        'isRealDate("2025-04-31") is false',
        isRealDate("2025-04-31") === false,
      );

      /*  Category  */
      group("Category (letters, spaces, hyphens)");
      assert('"Food" is valid', validateCategory("Food").valid);
      assert('"Fast-food" is valid', validateCategory("Fast-food").valid);
      assert(
        '"Study Supplies" is valid',
        validateCategory("Study Supplies").valid,
      );
      assert('"Food2" (digit) is invalid', !validateCategory("Food2").valid);
      assert(
        '"-Food" (leading hyphen) is invalid',
        !validateCategory("-Food").valid,
      );
      assert(
        '"Food--Bar" (double hyphen) is invalid',
        !validateCategory("Food--Bar").valid,
      );
      assert('"" (empty) is invalid', !validateCategory("").valid);

      /*  Advanced: duplicate word  */
      group("Advanced: duplicate word (back-reference)");
      assert(
        '"coffee coffee" gives a warning',
        checkDuplicateWords("coffee coffee") !== null,
      );
      assert(
        '"Coffee coffee" (different case) gives a warning',
        checkDuplicateWords("Coffee coffee") !== null,
      );
      assert(
        '"Coffee with friends" gives no warning',
        checkDuplicateWords("Coffee with friends") === null,
      );
      assert(
        '"the theory" gives no warning (not a full repeated word)',
        checkDuplicateWords("the theory") === null,
      );
      assert(
        "Warning does not make the description invalid",
        validateDescription("coffee coffee").valid,
      );

      /*  Whole record  */
      group("validateRecord");
      const good = validateRecord({
        description: "Bus pass",
        amount: "45.00",
        category: "Transport",
        date: "2025-09-20",
      });
      assert("A good record is valid", good.valid);
      const bad = validateRecord({
        description: " x",
        amount: "12.345",
        category: "Food2",
        date: "2025-13-01",
      });
      assert("A bad record is invalid", !bad.valid);
      assert(
        "A bad record reports all 4 errors",
        Object.keys(bad.errors).length === 4,
      );
      const dup = validateRecord({
        description: "tea tea",
        amount: "3",
        category: "Food",
        date: "2025-09-20",
      });
      assert(
        "A duplicate-word record is valid but has a warning",
        dup.valid && !!dup.warnings.description,
      );

      /*  Raw patterns  */
      group("Raw patterns");
      assert('patterns.amount matches "7.5"', patterns.amount.test("7.5"));
      assert(
        'patterns.date rejects "2025-00-10"',
        !patterns.date.test("2025-00-10"),
      );

      /*  Stats and cap  */
      group("Stats and cap");
      const sample = [
        { amount: 10, category: "Food", date: "2026-10-11" },
        { amount: 5.5, category: "Books", date: "2026-10-10" },
        { amount: 20, category: "Food", date: "2025-01-01" },
      ];
      assert("totalAmount sums records", totalAmount(sample) === 35.5);
      assert(
        "totalAmount avoids float errors (0.1 + 0.2)",
        totalAmount([{ amount: 0.1 }, { amount: 0.2 }]) === 0.3,
      );
      assert("topCategory is Food", topCategory(sample).name === "Food");
      assert("topCategory of empty list is null", topCategory([]) === null);
      assert(
        "trend has 7 days",
        trendLastSevenDays(sample, new Date(2026, 9, 11)).length === 7,
      );
      assert(
        "trend counts today",
        trendLastSevenDays(sample, new Date(2026, 9, 11))[6].total === 10,
      );
      assert(
        "trend counts yesterday",
        trendLastSevenDays(sample, new Date(2026, 9, 11))[5].total === 5.5,
      );
      assert(
        "trend ignores old records",
        trendLastSevenDays(sample, new Date(2026, 9, 11)).reduce(
          (s, d) => s + d.total,
          0,
        ) === 15.5,
      );
      assert("under cap", capStatus(100, 500).state === "under");
      assert(
        "exactly at cap is not over",
        capStatus(500, 500).state === "under",
      );
      assert("over cap", capStatus(550.5, 500).state === "over");
      assert("overage amount is 50.5", capStatus(550.5, 500).amount === 50.5);
      assert("cap 0 means no cap", capStatus(100, 0).state === "none");
      assert(
        'over message says "over"',
        capMessage(capStatus(600, 500), (n) => `$${n}`).includes("over"),
      );
      assert(
        'under message says "remaining"',
        capMessage(capStatus(100, 500), (n) => `$${n}`).includes("remaining"),
      );

      /*  Currency code and rate  */
      group("Currency code and rate (rate uses a lookahead)");
      assert('"USD" is a valid code', validateCurrencyCode("USD").valid);
      assert(
        '"usd" (lowercase) is invalid',
        !validateCurrencyCode("usd").valid,
      );
      assert('"US" (too short) is invalid', !validateCurrencyCode("US").valid);
      assert('"0.92" is a valid rate', validateRate("0.92").valid);
      assert('"1450" is a valid rate', validateRate("1450").valid);
      assert('"0" is an invalid rate', !validateRate("0").valid);
      assert('"0.00" is an invalid rate', !validateRate("0.00").valid);
      assert('"-1" is an invalid rate', !validateRate("-1").valid);
      assert(
        '"1.1234567" (7 decimals) is an invalid rate',
        !validateRate("1.1234567").valid,
      );

      /*  Categories list  */
      group("Categories list (Settings)");
      const cats = validateCategoriesText("Food, Books ,  Fast-food");
      assert("A good list is valid", cats.valid && cats.list.length === 3);
      assert(
        "Duplicates are removed (ignoring case)",
        validateCategoriesText("Food, food, FOOD").list.length === 1,
      );
      assert(
        "A name with a digit is invalid",
        !validateCategoriesText("Food, B00ks").valid,
      );
      assert("An empty list is invalid", !validateCategoriesText(" , ,").valid);

      /*  Stored data and import  */
      group("Stored records and JSON import validation");
      const rec = {
        id: "txn_0001",
        description: "Lunch",
        amount: 12.5,
        category: "Food",
        date: "2025-09-25",
        createdAt: "2025-09-25T12:00:00.000Z",
        updatedAt: "2025-09-25T12:00:00.000Z",
      };
      assert(
        "A good record has no problems",
        validateStoredRecord(rec).length === 0,
      );
      assert(
        "A string amount is rejected",
        validateStoredRecord({ ...rec, amount: "12.5" }).length > 0,
      );
      assert(
        "A missing id is rejected",
        validateStoredRecord({ ...rec, id: "" }).length > 0,
      );
      assert(
        "A bad date is rejected",
        validateStoredRecord({ ...rec, date: "2025-02-30" }).length > 0,
      );
      assert(
        "A bad timestamp is rejected",
        validateStoredRecord({ ...rec, createdAt: "yesterday" }).length > 0,
      );
      assert("A list of records imports", validateImportData([rec]).valid);
      assert(
        "{ records: [...] } imports",
        validateImportData({ records: [rec] }).valid,
      );
      assert("A string is rejected", !validateImportData("hello").valid);
      assert(
        "An object without records is rejected",
        !validateImportData({ foo: 1 }).valid,
      );
      assert(
        "Repeated ids are rejected",
        !validateImportData([rec, rec]).valid,
      );
      const goodSettings = {
        baseCurrency: "USD",
        currencies: ["USD", "EUR", "RWF"],
        rates: { EUR: 0.92, RWF: 1450 },
        displayCurrency: "USD",
        cap: 500,
        categories: ["Food", "Books"],
      };
      assert(
        "Good settings have no problems",
        validateSettingsObject(goodSettings).length === 0,
      );
      assert(
        "A negative cap is rejected",
        validateSettingsObject({ ...goodSettings, cap: -5 }).length > 0,
      );
      assert(
        "A missing rate is rejected",
        validateSettingsObject({ ...goodSettings, rates: { EUR: 0.92 } })
          .length > 0,
      );

      /*  Currency conversion  */
      group("Currency conversion (stored in base, shown in display currency)");
      const usd = {
        baseCurrency: "USD",
        rates: { EUR: 0.92, RWF: 1450 },
        displayCurrency: "USD",
      };
      const eur = { ...usd, displayCurrency: "EUR" };
      const rwf = { ...usd, displayCurrency: "RWF" };
      assert("Base currency rate is 1", getRate(usd, "USD") === 1);
      assert("10 USD is 9.2 EUR", Math.abs(convert(10, eur) - 9.2) < 1e-9);
      assert("formatMoney shows $12.50", formatMoney(12.5, usd) === "$12.50");
      assert(
        "formatMoney shows the euro sign",
        formatMoney(10, eur) === "€9.20",
      );
      assert(
        "RWF uses the code as prefix",
        formatMoney(1, rwf) === "RWF 1450.00",
      );
      assert(
        "displayNumber has no symbol",
        displayNumber(12.5, usd) === "12.50",
      );

      /*  Summary  */
      const summary = document.querySelector("#summary");
      summary.textContent = `${passed} passed, ${failed} failed`;
      summary.style.color = failed === 0 ? "#14532d" : "#b00020";
    </script>
  </body>
</html>
